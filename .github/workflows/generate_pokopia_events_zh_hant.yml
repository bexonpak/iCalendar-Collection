name: Generate Pokopia Events zh_Hant Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests icalendar pytz zhconv
      - name: Generate ICS
        run: python pokemon/pokopia/generate_events_zh_hant_ics.py
      - name: Commit and push
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add calendar/pokopia_events_zh_hant.ics
          git diff --staged --quiet || (git commit -m "Update Pokopia calendar [skip ci]" && git push)
